name: Bootstrap source

on:
  push:
    paths:
      - resolveops-ai-source.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -o resolveops-ai-source.zip
          rm resolveops-ai-source.zip
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ResolveOps AI source"
          git push
